services:
  # Backend API Service
  - type: web
    name: finance-tracker-backend
    env: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run db:migrate && npm run db:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finance-tracker-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://nikhil-singhal04.github.io
      - key: RATE_LIMIT_DISABLED
        value: false

  # Managed Redis Cache Service
  - type: redis
    name: finance-tracker-redis
    plan: free
    ipAllowList: []

databases:
  # Managed PostgreSQL
  - name: finance-tracker-postgres
    plan: free
    databaseName: finance_tracker
    user: finance_user
