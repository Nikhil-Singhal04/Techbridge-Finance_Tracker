services:
  # Backend API Service
  - type: web
    name: finance-tracker-backend
    env: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run db:migrate && npm run db:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finance-tracker-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://finance-tracker-frontend.vercel.app
      - key: RATE_LIMIT_DISABLED
        value: false

  # Frontend Web Service
  - type: web
    name: finance-tracker-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://finance-tracker-backend.onrender.com/api

databases:
  # Managed PostgreSQL 16
  - name: finance-tracker-postgres
    plan: free
    databaseName: finance_tracker
    user: postgres

  # Managed Redis 7
  - name: finance-tracker-redis
    plan: free
    ipAllowList: []
